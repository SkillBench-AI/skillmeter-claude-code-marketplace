name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Keep only the latest run per branch/PR; cancel superseded runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # Runs skillmeter/test/*.test.js, including the shared secret-fixture
      # parity suite (sanitize.test.js) fed by test/fixtures/secret-corpus.json.
      # A Tier-1 corpus miss fails here and blocks merge.
      - name: Run unit tests
        run: node --test
