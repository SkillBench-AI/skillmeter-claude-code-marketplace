name: CI

# One workflow for both clients, with no path filters: the internal channel
# waits for this one workflow and publishes both plugins from the same
# `internal` branch, so it must never publish after only one of them passed.

on:
  push:
    branches: [main, next]
  pull_request:
  workflow_dispatch:

# Keep only the latest run per branch/PR; cancel superseded runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/claude-code
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          # Upgrade fixtures load actual pinned releases from local Git objects.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # Runs test/*.test.js, including the shared secret-fixture
      # parity suite (sanitize.test.js) fed by test/fixtures/secret-corpus.json.
      # A Tier-1 corpus miss fails here and blocks merge.
      - name: Run unit tests
        run: node --test

  validate:
    name: Validate plugin (Claude Code ${{ matrix.claude-code }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest release that loads the display module (hooks/status.tsx)
        # with the APIs it uses, and the newest this was checked against.
        claude-code: ["2.1.280", "2.1.296"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Reads the manifest, hooks.json and the module the way that release's
      # loader would, and fails on anything it would refuse.
      - name: claude plugin validate
        run: npx -y "@anthropic-ai/claude-code@${{ matrix.claude-code }}" plugin validate clients/claude-code/skillmeter
      # The marketplace Claude Code reads, at the repository root.
      - name: claude marketplace validate
        run: npx -y "@anthropic-ai/claude-code@${{ matrix.claude-code }}" plugin validate .

  shared:
    name: Shared modules in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # shared/lib is the source; each plugin carries a generated copy.
      - name: Check shared/lib copies
        run: node scripts/sync-shared.mjs --check

  codex-validate:
    name: "Codex: validate manifests & version"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/codex
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check plugin version is clean SemVer
        run: node .github/scripts/check-version.mjs
      # Also fails if `.agents/plugins/marketplace.json` is missing, without
      # which Codex would fall back to the Claude Code marketplace.
      - name: Validate marketplace & plugin manifests
        run: node .github/scripts/validate-manifests.mjs

  codex-test:
    name: "Codex: test (Node ${{ matrix.node-version }})"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/codex
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run unit tests
        run: node --test
