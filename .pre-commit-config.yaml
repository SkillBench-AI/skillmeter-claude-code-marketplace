repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]

  # Codex client guards mirroring the CI gate, so version/manifest mistakes are
  # caught before they reach a PR. Dependency-free Node scripts (no install).
  - repo: local
    hooks:
      - id: check-plugin-version
        name: plugin version is clean SemVer
        entry: node clients/codex/.github/scripts/check-version.mjs
        language: system
        files: ^clients/codex/plugins/skillmeter/\.codex-plugin/plugin\.json$
        pass_filenames: false
      - id: validate-manifests
        name: validate marketplace & plugin manifests
        entry: node clients/codex/.github/scripts/validate-manifests.mjs
        language: system
        files: ^(clients/codex/plugins/skillmeter/\.codex-plugin/plugin\.json|\.agents/plugins/marketplace\.json)$
        pass_filenames: false
      - id: shared-modules
        name: shared/lib copies are in sync
        entry: node scripts/sync-shared.mjs --check
        language: system
        files: ^(shared/lib/|clients/[^/]+/.*scripts/lib/)
        pass_filenames: false
